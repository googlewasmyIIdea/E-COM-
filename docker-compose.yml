services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app]
  backend:
    build: ./backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: database
      CORS_ORIGINS: ${APP_ORIGIN:-http://localhost:3000}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      SESSION_HOURS: 8
      RESERVATION_MINUTES: ${RESERVATION_MINUTES:-15}
      MAIL_DIR: /data/mailbox
      UPLOAD_DIR: /data/media
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      EMAIL_FROM: ${EMAIL_FROM:-Paper & Petal <hello@paperandpetal.local>}
      PAYMENT_ENVIRONMENT: ${PAYMENT_ENVIRONMENT:-sandbox}
      ESEWA_PRODUCT_CODE: ${ESEWA_PRODUCT_CODE:-}
      ESEWA_SECRET_KEY: ${ESEWA_SECRET_KEY:-}
      KHALTI_SECRET_KEY: ${KHALTI_SECRET_KEY:-}
      ENABLE_EMAIL_VERIFICATION: ${ENABLE_EMAIL_VERIFICATION:-false}
    command: ["sh", "-c", "uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn backend.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    volumes:
      - product_media:/data/media
      - local_mail:/data/mailbox
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      database:
        condition: service_healthy
    networks: [app]
  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    ports: ["3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]
volumes:
  postgres_data:
  product_media:
  local_mail:
networks:
  app:
