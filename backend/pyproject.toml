[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=4",
    "alembic>=1.16",
    "asyncpg>=0.30",
    "email-validator>=2.2",
    "fastapi>=0.142.2",
    "httpx>=0.28",
    "pillow>=11",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.8",
    "pytest>=9.1.1",
    "python-multipart>=0.0.20",
    "ruff>=0.16.10",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.34",
]

[project.scripts]
backend = "backend:main"
create-user = "backend.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.21",
    "httpx>=0.28",
    "mypy>=1.15",
    "pytest-asyncio>=1.0",
]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
